<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendas do mês · Carflix Osasco</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --card: #ffffff; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --brand: #1f3a5f; --brand-ink: #ffffff; --brand-soft: #e8eef6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --crit: #d03b3b;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0d0d; --card: #1a1a19; --surface: #1a1a19;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --brand: #3987e5; --brand-ink: #0d0d0d; --brand-soft: #1c2533;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --good-ink: #0ca30c; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0d0d; --card: #1a1a19; --surface: #1a1a19;
  --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
  --brand: #3987e5; --brand-ink: #0d0d0d; --brand-soft: #1c2533;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --good-ink: #0ca30c; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select { font: inherit; color: inherit; }
.top { display: flex; align-items: center; gap: 12px; padding: 12px 24px; background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 5; }
.marca { display: flex; align-items: center; gap: 10px; font-weight: 700; cursor: pointer; background: none; border: 0; padding: 0; }
.marca .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; }
.top .esp { flex: 1; }
.chip { font-size: 13px; color: var(--ink2); }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
.btn:hover { background: var(--brand-soft); }
.btn.pri { background: var(--brand); color: var(--brand-ink); border-color: transparent; font-weight: 600; }
main { max-width: 1180px; margin: 0 auto; padding: 24px; }
.cab { display: flex; flex-wrap: wrap; align-items: end; gap: 12px 20px; margin-bottom: 20px; }
.cab h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; }
.cab .sub { color: var(--ink2); font-size: 14px; margin-top: 2px; }
.cab .esp { flex: 1; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 20px; }
.tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.t-l { font-size: 13px; color: var(--ink2); }
.t-v { font-size: 26px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; }
.t-of { font-size: 15px; color: var(--muted); font-weight: 400; }
.t-s { font-size: 12px; color: var(--ink2); margin-top: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.bar { position: relative; height: 8px; border-radius: 4px; background: var(--grid); margin-top: 10px; }
.bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 4px; background: var(--s1); }
.bar > i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink2); border-radius: 1px; }
.st { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-good { color: var(--good-ink); } .st-good::before { background: var(--good); }
.st-warn { color: var(--ink2); } .st-warn::before { background: var(--warn); }
.st-crit { color: var(--crit); } .st-crit::before { background: var(--crit); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; margin-bottom: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { margin: 0; font-size: 15px; }
.card .sub { margin: 2px 0 12px; font-size: 12px; color: var(--muted); }
.ch { position: relative; height: 260px; }
.full { grid-column: 1 / -1; }
.tab { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 600; color: var(--ink2); border-bottom: 1px solid var(--axis); padding: 8px 10px; white-space: nowrap; }
td { border-bottom: 1px solid var(--grid); padding: 8px 10px; vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.vazio { color: var(--muted); font-size: 13px; padding: 12px 0; }
.carregando { text-align: center; padding: 80px 0; color: var(--muted); }

/* equipe na página geral */
.equipe { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.pessoa { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color .12s, transform .12s; }
.pessoa:hover { border-color: var(--brand); transform: translateY(-1px); }
.pessoa .nm { font-weight: 650; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.pessoa .ir { color: var(--brand); font-weight: 600; font-size: 13px; margin-top: 4px; }
.pos { width: 26px; height: 26px; border-radius: 50%; background: var(--brand-soft); color: var(--brand); display: grid; place-items: center; font-size: 13px; }

/* períodos */
.periodos { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--border); border-radius: 10px; background: var(--card); padding: 3px; gap: 2px; }
.periodos button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; font-size: 14px; color: var(--ink2); }
.periodos button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.nav { display: inline-flex; align-items: center; gap: 8px; }
.nav b { min-width: 170px; text-align: center; font-size: 14px; }

/* chave */
.box { background: var(--card); border-radius: 14px; padding: 28px; max-width: 400px; margin: 40px auto; border: 1px solid var(--border); box-shadow: var(--shadow); }
.box h2 { margin: 0 0 4px; }
.box p { margin: 0 0 16px; color: var(--ink2); font-size: 14px; }
.box label { display: block; font-size: 13px; color: var(--ink2); margin: 12px 0 4px; }
.box input[type=password] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 18px; letter-spacing: .2em; }
.box .lembrar { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 14px; color: var(--ink2); }
.box .acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
.erro { color: var(--crit); font-size: 13px; margin-top: 10px; min-height: 1em; }
.dica { font-size: 13px; color: var(--ink2); background: var(--brand-soft); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }

/* simulador */
.campo { display: block; margin-bottom: 16px; }
.campo > span { display: block; font-size: 13px; color: var(--ink2); margin-bottom: 4px; }
.inp { width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 16px; font-variant-numeric: tabular-nums; }
.inp.peq { width: 96px; text-align: right; }
.passo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.passo .inp { width: 80px; text-align: center; }
.atalhos { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.atalhos .btn { font-size: 13px; padding: 5px 10px; }
.res-l { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
.res-l span:first-child { color: var(--ink2); }
.res-l b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.res-total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-top: 14px; }
.res-total b { font-size: 30px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }

/* contato semanal com proprietários */
.ct-resumo { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 18px; }
.ct-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; font-size: 14px; color: var(--ink2); }
.ct-sel { width: auto; padding: 6px 10px; font-size: 14px; margin-left: 4px; }
.ct-lista { padding: 4px 14px; }
.ct-item { border-bottom: 1px solid var(--grid); }
.ct-item:last-child { border-bottom: 0; }
.ct-item summary { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 0; cursor: pointer; list-style: none; }
.ct-item summary::-webkit-details-marker { display: none; }
.ct-item summary::before { content: "▸"; color: var(--muted); width: 10px; }
.ct-item[open] summary::before { content: "▾"; }
.ct-car { flex: 1 1 220px; min-width: 0; display: flex; flex-direction: column; font-size: 14px; }
.ct-car span { font-size: 12px; color: var(--muted); }
.ct-prio { font-size: 12px; background: var(--brand-soft); color: var(--ink2); border-radius: 6px; padding: 1px 8px; white-space: nowrap; }
.ct-acoes { display: flex; gap: 6px; align-items: center; }
.ct-acoes .btn { padding: 4px 10px; font-size: 13px; }
.ct-acoes a.btn { text-decoration: none; }
.ct-env { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--ink2); }
.ct-det { padding: 0 0 12px 22px; }
.ct-sub { font-size: 13px; color: var(--ink2); margin-top: 4px; }
.ct-msg { white-space: pre-wrap; font-size: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 8px; }

/* base de conhecimento: guia da venda com carro na troca */
.kb-topicos { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.kb-topico { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--brand); background: var(--brand-soft); color: var(--ink); border-radius: 10px; padding: 8px 14px; font-weight: 600; font-size: 14px; }
.kb-topico.breve { border-style: dashed; border-color: var(--axis); background: none; color: var(--muted); font-weight: 400; }
.kb-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.kb-lado { display: flex; flex-direction: column; gap: 16px; }
.kb-venda { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.kb-venda .inp { width: auto; flex: 1 1 160px; font-size: 14px; padding: 7px 10px; }
.kb-venda select.inp { flex: 0 1 200px; }
.kb-venda .btn { font-size: 13px; padding: 6px 10px; }
.kb-prog { display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: var(--ink2); margin-top: 4px; }
.kb-fase { border-left: 3px solid var(--fc); padding-left: 14px; margin-top: 20px; }
.kb-fase h4 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.kb-fase h4 small { font-weight: 400; color: var(--muted); font-size: 12px; }
.kb-fase > p { margin: 2px 0 10px; font-size: 13px; color: var(--ink2); }
.kb-passo { display: flex; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; background: var(--surface); transition: border-color .12s; }
.kb-passo.atual { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.kb-passo.feito .kb-t { color: var(--muted); }
.kb-num { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--axis); background: var(--card); display: grid; place-items: center; font-weight: 650; font-size: 13px; cursor: pointer; padding: 0; }
.kb-num:hover { border-color: var(--good); }
.kb-passo.feito .kb-num { background: var(--good); border-color: var(--good); color: #fff; }
.kb-corpo { flex: 1; min-width: 0; }
.kb-t { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 5px 0 0; font-weight: 600; cursor: pointer; }
.kb-tag { display: inline-block; font-size: 11px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 6px; padding: 1px 7px; margin-left: 8px; vertical-align: 1px; }
.kb-tag.ok { color: var(--good-ink); background: color-mix(in srgb, var(--good) 14%, transparent); }
.kb-o { font-size: 14px; color: var(--ink2); margin-top: 4px; }
.kb-alerta { font-size: 13px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--warn) 20%, transparent); color: var(--ink); }
.kb-nota { font-size: 13px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: var(--brand-soft); color: var(--ink); font-weight: 600; }
.kb-trava { font-size: 13px; margin-top: 8px; color: var(--crit); font-weight: 600; }
.kb-acao { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.kb-acao .btn { font-size: 13px; padding: 6px 12px; }
.kb-fim { text-align: center; padding: 16px; margin-top: 16px; border-radius: 10px; background: color-mix(in srgb, var(--good) 12%, transparent); color: var(--good-ink); font-weight: 650; }
.kb-al { border-bottom: 1px solid var(--grid); }
.kb-al:last-child { border-bottom: 0; }
.kb-al summary { padding: 9px 0; cursor: pointer; font-size: 14px; font-weight: 600; list-style: none; display: flex; gap: 8px; align-items: center; }
.kb-al summary::-webkit-details-marker { display: none; }
.kb-al summary::before { content: "▸"; color: var(--muted); width: 10px; }
.kb-al[open] summary::before { content: "▾"; }
.kb-al div { padding: 0 0 10px 18px; font-size: 13px; color: var(--ink2); }
.kb-al div b { color: var(--ink); }
.kb-adl { display: flex !important; justify-content: space-between; align-items: center; }
.kb-x { border: 0; background: none; color: var(--muted); font-size: 12px; cursor: pointer; padding: 0 2px; }
.kb-x:hover { color: var(--crit); }
.kb-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }

@media (max-width: 860px) { .kb-grid { grid-template-columns: 1fr; } }
@media (max-width: 640px) {
  main { padding: 16px; }
  .top { padding: 10px 16px; }
  .grid { grid-template-columns: 1fr; }
  .nav b { min-width: 0; }
}
</style>
</head>
<body>
<header class="top">
  <button class="marca" onclick="irGeral()" aria-label="Página geral">
    <span class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17h18M5 17l1.5-5h11L19 17M7.5 12l1.2-3.5h6.6L16.5 12"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/></svg></span>
    Vendas · Carflix Osasco
  </button>
  <span class="esp"></span>
  <span class="chip" id="chip"></span>
</header>
<main id="app"><div class="carregando">Carregando…</div></main>

<script>
// ================= utilidades =================
const MESES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => (v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
const int = v => (v || 0).toLocaleString('pt-BR');
const dec = v => isFinite(v) ? v.toLocaleString('pt-BR', { maximumFractionDigits: 1 }) : '—';
const pct = v => isFinite(v) ? Math.round(v * 100) + '%' : '—';
const soma = (a, f) => a.reduce((s, x) => s + (f(x) || 0), 0);
const dataBR = d => d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
const D = s => new Date(s + 'T12:00');
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDias = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return iso(d); };
const fimMes = (y, m) => iso(new Date(y, m + 1, 0, 12));
const cor = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

// dias de trabalho = segunda a sábado
const util = s => D(s).getDay() !== 0;
function diasUteis(ini, fim) { let n = 0; for (let s = ini; s <= fim; s = addDias(s, 1)) if (util(s)) n++; return n; }
// meta de um intervalo = meta mensal proporcional aos dias úteis de cada mês tocado
function metaIntervalo(metaMes, ini, fim) {
  if (!metaMes) return 0;
  let total = 0, s = ini;
  while (s <= fim) {
    const d = D(s), ultimo = fimMes(d.getFullYear(), d.getMonth()), ate = ultimo < fim ? ultimo : fim;
    const uMes = diasUteis(iso(new Date(d.getFullYear(), d.getMonth(), 1, 12)), ultimo);
    total += uMes ? metaMes * diasUteis(s, ate) / uMes : 0;
    s = addDias(ate, 1);
  }
  return total;
}

// ================= servidor (Apps Script) ou prévia =================
// Três modos: dentro do Apps Script (google.script.run); hospedada fora do Google (API do web app,
// sem usar a conta Google de quem abre); ou prévia local com dados fictícios.
const API_URL = 'https://script.google.com/macros/s/AKfycbwer3lCUJAFzThWjRQooowAVUpvJnSGdAiA8ic6BE_rQZosEPNwMrKHJQzEi3O5XpDvUA/exec';
const NO_GOOGLE = !(window.google && google.script && google.script.run);
const PREVIA = NO_GOOGLE && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]api=1/.test(location.search);
function api(fn, ...args) {
  if (PREVIA) return new Promise((ok, erro) => setTimeout(() => { try { ok(DEMO[fn](...args)); } catch (e) { erro(e); } }, 150));
  if (NO_GOOGLE) {
    const corpo = fn === 'entrarVendedor' ? { portal: fn, nome: args[0], chave: args[1] } : { portal: fn };
    // text/plain e sem cookies: o Google não tenta abrir com a conta do navegador
    return fetch(API_URL, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(corpo) })
      .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.erro || 'Erro ao buscar os dados.'); return j.dados; });
  }
  return new Promise((ok, erro) => google.script.run.withSuccessHandler(ok).withFailureHandler(erro)[fn](...args));
}
// mantém o endereço do navegador em ?v=<vendedor>, para o vendedor salvar nos favoritos / página inicial
function marcarUrl(v) {
  if (NO_GOOGLE) {
    const q = new URLSearchParams(location.search); if (v) q.set('v', v); else q.delete('v');
    if (S.pagina !== 'vendas') q.set('p', S.pagina); else q.delete('p');
    try { history.replaceState(null, '', location.pathname + (q.toString() ? '?' + q : '')); } catch (e) {}
    return;
  }
  const p = { app: 'vendas' }; if (v) p.v = v;
  try { google.script.history.push(null, p); } catch (e) {}
}

// três páginas com a mesma chave: Vendas (padrão), Desempenho individual (?p=desempenho) e Simulador (?p=simulador)
const PAGINAS = { vendas: 'Vendas', desempenho: 'Desempenho individual', simulador: 'Simulador do mês', operacional: 'Operacional', base: 'Base de conhecimento' };
// subpáginas: abrem de dentro de uma aba (contatos = lista semanal de proprietários, dentro de Operacional)
const SUBPAGINAS = { contatos: 'operacional' };
const pInicial = new URLSearchParams(location.search).get('p');
const S = { geral: null, eu: null, periodo: 'mes', desloc: 0,
            pagina: PAGINAS[pInicial] || SUBPAGINAS[pInicial] ? pInicial : 'vendas' };
function mostrar() { ({ desempenho: viewDesempenho, simulador: viewSimulador, operacional: viewOperacional, contatos: viewContatos, base: viewBase }[S.pagina] || viewVendedor)(); }
function irPagina(p) { S.pagina = p; marcarUrl(S.eu ? S.eu.nome : ''); window.scrollTo(0, 0); mostrar(); }
function abas() {
  return `<div class="periodos" role="tablist" aria-label="Página" style="margin-bottom:16px">
    ${Object.entries(PAGINAS).map(([k, t]) => `<button role="tab" aria-pressed="${S.pagina === k || SUBPAGINAS[S.pagina] === k}" onclick="irPagina('${k}')">${t}</button>`).join('')}</div>`;
}
const charts = {};
function limparGraficos() { Object.keys(charts).forEach(k => { charts[k].destroy(); delete charts[k]; }); }
function grafico(id, labels, datasets, o = {}) {
  const el = document.getElementById(id); if (!el) return;
  const fmt = o.fmt || int;
  Chart.defaults.font.family = 'system-ui, -apple-system, "Segoe UI", sans-serif';
  Chart.defaults.color = cor('--muted');
  const ds = datasets.map(d => d.type === 'line'
    ? { borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, tension: 0, borderColor: cor('--ink2'), backgroundColor: cor('--ink2'), yAxisID: d.yAxisID || 'y', ...d }
    : { borderRadius: 4, borderSkipped: 'start', maxBarThickness: 34, borderWidth: 0, backgroundColor: cor('--s1'), ...d });
  const eixo = (pos, f) => ({ position: pos, beginAtZero: true, grid: { color: pos === 'left' ? cor('--grid') : 'transparent' }, border: { display: false }, ticks: { color: cor('--muted'), callback: v => f(v), maxTicksLimit: 6 } });
  const scales = { x: { grid: { display: false }, border: { color: cor('--axis') }, ticks: { color: cor('--muted'), maxRotation: 0, autoSkip: true } }, y: eixo('left', fmt) };
  if (o.fmt2) scales.y2 = eixo('right', o.fmt2);
  if (o.max) scales.y.max = o.max;
  charts[id] = new Chart(el, {
    type: 'bar', data: { labels, datasets: ds },
    options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: datasets.length > 1, position: 'bottom', labels: { usePointStyle: true, boxWidth: 8, boxHeight: 8, color: cor('--ink2') } },
        tooltip: { backgroundColor: cor('--card'), titleColor: cor('--ink'), bodyColor: cor('--ink2'), borderColor: cor('--border'), borderWidth: 1, padding: 10,
          callbacks: { label: c => ` ${c.dataset.label}: ${(c.dataset.yAxisID === 'y2' ? o.fmt2 : fmt)(c.parsed.y)}` } } },
      scales }
  });
}
function card(id, titulo, sub, cls = '', h = 260) {
  return `<div class="card ${cls}"><h3>${titulo}</h3><p class="sub">${sub}</p><div class="ch" style="height:${h}px"><canvas id="${id}" role="img" aria-label="${esc(titulo)}"></canvas></div></div>`;
}
function tile(label, valor, sub = '') { return `<div class="tile"><div class="t-l">${label}</div><div class="t-v">${valor}</div>${sub ? `<div class="t-s">${sub}</div>` : ''}</div>`; }
// situação diante da meta: compara com o esperado até hoje quando o período ainda está correndo
function situacao(real, meta, esperado) {
  if (!meta) return { c: 'warn', t: 'Meta não definida' };
  if (real >= meta) return { c: 'good', t: 'Meta batida' };
  if (esperado == null) return { c: 'crit', t: 'Meta não batida' };
  return real >= esperado * 0.9 ? { c: 'good', t: 'No ritmo' } : real >= esperado * 0.6 ? { c: 'warn', t: 'Abaixo do ritmo' } : { c: 'crit', t: 'Muito abaixo do ritmo' };
}
function tileMeta(label, real, meta, esperado, extra = '') {
  const st = situacao(real, meta, esperado);
  const ritmo = meta && esperado != null && real < meta ? `<i style="left:calc(${Math.min(100, esperado / meta * 100)}% - 1px)" title="Esperado até hoje"></i>` : '';
  return `<div class="tile"><div class="t-l">${label}</div>
    <div class="t-v">${int(real)} <span class="t-of">/ ${meta ? dec(meta) : '—'}</span></div>
    <div class="bar"><span style="width:${meta ? Math.min(100, real / meta * 100) : 0}%"></span>${ritmo}</div>
    <div class="t-s"><span class="st st-${st.c}">${st.t}</span>${meta ? `<span>${pct(real / meta)} da meta</span>` : ''}${extra}</div></div>`;
}

const PERIODOS = { dia: 'Diário', semana: 'Semanal', mes: 'Mensal', trimestre: 'Trimestral', semestre: 'Semestral', ano: 'Anual' };
// intervalo do período escolhido, deslocado k períodos para trás (k <= 0)
function intervalo(tipo, hoje, k) {
  const d = D(hoje), y = d.getFullYear(), m = d.getMonth();
  if (tipo === 'dia') { const s = addDias(hoje, k); return { ini: s, fim: s, rot: dataBR(s) }; }
  if (tipo === 'semana') { const seg = addDias(hoje, -((d.getDay() + 6) % 7) + 7 * k); return { ini: seg, fim: addDias(seg, 6), rot: `${dataBR(seg).slice(0, 5)} a ${dataBR(addDias(seg, 6)).slice(0, 5)}` }; }
  const n = { mes: 1, trimestre: 3, semestre: 6, ano: 12 }[tipo];
  const base = tipo === 'ano' ? new Date(y + k, 0, 1, 12) : new Date(y, Math.floor(m / n) * n + n * k, 1, 12);
  const ini = iso(base), fim = fimMes(base.getFullYear(), base.getMonth() + n - 1), by = base.getFullYear(), bm = base.getMonth();
  const rot = tipo === 'mes' ? `${MESES[bm]}/${by}` : tipo === 'trimestre' ? `${bm / 3 + 1}º trimestre ${by}` : tipo === 'semestre' ? `${bm / 6 + 1}º semestre ${by}` : String(by);
  return { ini, fim, rot };
}
// fatias do gráfico de evolução dentro do período
function fatias(tipo, iv) {
  const out = [];
  if (tipo === 'dia') { for (let i = -13; i <= 0; i++) { const s = addDias(iv.ini, i); out.push({ ini: s, fim: s, rot: s.slice(8) + '/' + s.slice(5, 7) }); } return out; }
  if (tipo === 'semana' || tipo === 'mes') { for (let s = iv.ini; s <= iv.fim; s = addDias(s, 1)) out.push({ ini: s, fim: s, rot: tipo === 'semana' ? ['dom','seg','ter','qua','qui','sex','sáb'][D(s).getDay()] + ' ' + s.slice(8) : s.slice(8) }); return out; }
  if (tipo === 'trimestre') { let s = iv.ini; while (s <= iv.fim) { const dom = addDias(s, (7 - D(s).getDay()) % 7), f = dom < iv.fim ? dom : iv.fim; out.push({ ini: s, fim: f, rot: s.slice(8) + '/' + s.slice(5, 7) }); s = addDias(f, 1); } return out; }
  let s = iv.ini; while (s <= iv.fim) { const d = D(s), f = fimMes(d.getFullYear(), d.getMonth()); out.push({ ini: s, fim: f, rot: MESES[d.getMonth()] }); s = addDias(f, 1); } return out;
}
function mudarPeriodo(p) { S.periodo = p; S.desloc = 0; lsSet('periodo', p); viewVendedor(); }
function andar(n) { S.desloc = Math.min(0, S.desloc + n); viewVendedor(); }

    <div class="cab" style="margin-bottom:16px">

const ADIC = ['Despachante', 'Seguro Gestauto', 'Seguro auto', 'Carro na troca', 'Financiamento'];
// cada carro vendido com o valor de cada item da comissão (valor fixo + adicionais marcados pelo gestor)
function tabelaComissao(vs, regras) {
  if (!vs.length) return '<div class="vazio">Nenhuma venda neste período.</div>';
  regras = regras || { fixo: 0 };
  // valor de cada adicional lançado pelo gestor naquela venda (muda de carro para carro)
  const valor = (v, a) => { const x = v.valores ? v.valores[a] : 0; return x > 0 ? x : null; };
  const cols = ADIC.filter(a => vs.some(v => valor(v, a) != null));
  const cel = x => x == null ? '<span style="color:var(--muted)">—</span>' : brl(x);
  const linhas = vs.map(v => `<tr><td>${dataBR(v.data)}</td><td>${esc(v.veiculo)}<div style="color:var(--muted);font-size:12px">${esc(v.placa)}${v.tipo ? ' · ' + esc(v.tipo) : ''}</div></td>
    <td class="n">${brl(regras.fixo)}</td>${cols.map(a => `<td class="n">${cel(valor(v, a))}</td>`).join('')}<td class="n"><b>${brl(v.comissao)}</b></td></tr>`).join('');
  const total = `<tr style="border-top:2px solid var(--axis)"><td colspan="2"><b>Total (${int(vs.length)} venda${vs.length > 1 ? 's' : ''})</b></td>
    <td class="n"><b>${brl(regras.fixo * vs.length)}</b></td>${cols.map(a => `<td class="n"><b>${brl(soma(vs, v => valor(v, a)))}</b></td>`).join('')}<td class="n"><b>${brl(soma(vs, v => v.comissao))}</b></td></tr>`;
  return `<div class="tab"><table><thead><tr><th>Data</th><th>Veículo</th><th class="n">Venda</th>${cols.map(a => `<th class="n">${esc(a)}</th>`).join('')}<th class="n">Comissão</th></tr></thead>
    <tbody>${linhas}${total}</tbody></table></div>`;
}

// ================= SIMULADOR DO MÊS =================
// parte do que o vendedor já tem lançado no mês; o salário fixo e as simulações ficam só neste aparelho
const numero = v => Math.max(0, Math.round(Number(String(v).replace(/\./g, '').replace(',', '.')) || 0));
function simCarregar(eu) {
  let salvo = {}; try { salvo = JSON.parse(lsGet('sim_' + eu.nome) || '{}') || {}; } catch (e) {}
  // vendas e adicionais simulados valem só para o mês em que foram digitados; o salário fixo fica
  const mesmoMes = salvo.mes === eu.hoje.slice(0, 7);
  const adic = {};
  ADIC.forEach(a => {
    // valor sugerido = média do que o gestor já lançou para você nesse adicional
    const xs = eu.vendas.map(v => v.valores ? v.valores[a] : 0).filter(x => x > 0), s = (salvo.adic || {})[a] || {};
    adic[a] = { qtd: mesmoMes ? numero(s.qtd) : 0, valor: s.valor != null ? numero(s.valor) : xs.length ? Math.round(soma(xs, x => x) / xs.length) : 0 };
  });
  return { salario: numero(salvo.salario), extra: mesmoMes ? numero(salvo.extra) : 0, adic };
}
function simSalvar() { lsSet('sim_' + S.eu.nome, JSON.stringify({ ...S.sim, mes: S.eu.hoje.slice(0, 7) })); }
// números do mês atual: o que já está lançado e o que entra com a simulação
function simCalc(extra) {
  const eu = S.eu, sim = S.sim, mesI = intervalo('mes', eu.hoje, 0), fixo = (eu.regras || {}).fixo || 0;
  const feitas = eu.vendas.filter(v => v.data >= mesI.ini && v.data <= mesI.fim);
  const comFeita = soma(feitas, v => v.comissao);
  const adicSim = soma(ADIC, a => Math.min(sim.adic[a].qtd, extra) * sim.adic[a].valor);
  const total = feitas.length + extra, faixas = eu.bonus || [];
  const faixa = faixas.filter(f => total >= f.vendas).pop();
  const bonus = faixa ? faixa.valor : 0, comSim = extra * fixo + adicSim;
  return { feitas: feitas.length, comFeita, extra, fixo, adicSim, comSim, total, bonus, faixa,
           final: sim.salario + comFeita + comSim + bonus };
}
function viewSimulador() {
  limparGraficos();
  const eu = S.eu, hoje = eu.hoje;
  const mes = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'][+hoje.slice(5, 7) - 1];
  $('#chip').textContent = eu.nome;
  if (!S.sim || S.simDe !== eu.nome) { S.sim = simCarregar(eu); S.simDe = eu.nome; }
  const sim = S.sim, c = simCalc(sim.extra);
  // atalhos: quanto falta para a meta e para cada faixa de bônus
  const atalhos = [];
  if (eu.meta && c.feitas < eu.meta) atalhos.push({ n: Math.ceil(eu.meta) - c.feitas, t: `Bater minha meta (${dec(eu.meta)})` });
  (eu.bonus || []).forEach(f => {
    if (c.feitas >= f.vendas) return;
    const n = f.vendas - c.feitas, igual = atalhos.find(a => a.n === n);
    if (igual) igual.t += ` + bônus de ${brl(f.valor)}`; else atalhos.push({ n, t: `Bônus de ${brl(f.valor)} (${f.vendas} vendas)` });
  });
  $('#app').innerHTML = `<div class="cab"><div><h1>Simulador de ${mes}</h1>
      <div class="sub">Imagine quantas vendas ainda vai fazer e veja quanto fecha o mês · ${int(c.feitas)} venda(s) já lançada(s) pelo gestor</div></div>
      <span class="esp"></span>
      <button class="btn" onclick="sair()">Sair</button></div>
    ${abas()}
    <div class="dica">O salário fixo e os números que você digitar aqui ficam salvos só neste aparelho; ninguém mais vê. A comissão de cada venda simulada usa o valor fixo por venda definido pelo gestor (${brl(c.fixo)}) mais os adicionais que você marcar.</div>
    <div class="grid">
      <div class="card"><h3>Seus números</h3><p class="sub">Mude os valores e o resultado ao lado se atualiza</p>
        <label class="campo"><span>Salário fixo mensal (R$)</span>

        <div class="campo"><span>Vendas a mais até o fim de ${mes}</span>
          <div class="passo"><button class="btn" onclick="simExtra(-1)" aria-label="Menos uma venda">−</button>

            <button class="btn" onclick="simExtra(1)" aria-label="Mais uma venda">+</button></div>
          ${atalhos.length ? `<div class="atalhos">${atalhos.map(a => `<button class="btn" onclick="simExtra(0, ${a.n})">${esc(a.t)}: +${a.n}</button>`).join('')}</div>` : ''}</div>
        <div class="campo"><span>Adicionais nas vendas simuladas</span>
          <div class="tab"><table><thead><tr><th>Adicional</th><th class="n">Em quantas vendas</th><th class="n">Valor de cada (R$)</th></tr></thead><tbody>
            ${ADIC.map((a, i) => `<tr><td>${esc(a)}</td>
              <td class="n"><input class="inp peq" id="sQ${i}" inputmode="numeric" value="${sim.adic[a].qtd || ''}" placeholder="0" oninput="simMudou()" aria-label="${esc(a)}: em quantas vendas"></td>
              <td class="n"><input class="inp peq" id="sV${i}" inputmode="numeric" value="${sim.adic[a].valor || ''}" placeholder="0" oninput="simMudou()" aria-label="${esc(a)}: valor de cada"></td></tr>`).join('')}
          </tbody></table></div>
          <div class="t-s">O valor de cada adicional vem preenchido com a média do que você já recebeu nele. Ajuste se quiser.</div></div>
      </div>
      <div class="card"><h3>Faturamento previsto em ${mes}</h3><p class="sub">Salário + comissões + bônus, se as vendas simuladas acontecerem</p>
        <div id="sRes"></div></div>
    </div>
    <div class="card full"><h3>E se…</h3><p class="sub">Quanto o mês fecharia em cada cenário, com o mesmo salário e a mesma média por venda simulada</p>
      <div id="sCen"></div></div>`;
  simResultado();
}
function simResultado() {
  const eu = S.eu, c = simCalc(S.sim.extra), faixas = eu.bonus || [];
  const prox = faixas.find(f => c.total < f.vendas), meta = eu.meta;
  const st = meta ? (c.total >= meta ? { c: 'good', t: 'Meta batida' } : { c: 'warn', t: `faltariam ${int(Math.ceil(meta) - c.total)} para a meta` }) : null;
  $('#sRes').innerHTML = `
    <div class="res-l"><span>Salário fixo</span><b>${brl(S.sim.salario)}</b></div>
    <div class="res-l"><span>Comissão já lançada (${int(c.feitas)} venda${c.feitas === 1 ? '' : 's'})</span><b>${brl(c.comFeita)}</b></div>
    <div class="res-l"><span>Comissão das vendas simuladas (${int(c.extra)} × ${brl(c.fixo)}${c.adicSim ? ` + ${brl(c.adicSim)} de adicionais` : ''})</span><b>${brl(c.comSim)}</b></div>
    <div class="res-l"><span>Bônus do mês (${int(c.total)} vendas no total)</span><b>${brl(c.bonus)}</b></div>
    <div class="res-total"><span>Total previsto</span><b>${brl(c.final)}</b></div>
    ${meta ? `<div class="bar" style="margin-top:14px"><span style="width:${Math.min(100, c.total / meta * 100)}%"></span>${c.feitas && c.feitas < meta ? `<i style="left:calc(${c.feitas / meta * 100}% - 1px)" title="Já lançadas"></i>` : ''}</div>` : ''}
    <div class="t-s">${st ? `<span class="st st-${st.c}">${st.t}</span><span>${int(c.total)} de ${dec(meta)} vendas</span>` : ''}
      ${prox ? `<span>com mais ${int(prox.vendas - c.total)} venda(s) o bônus sobe para ${brl(prox.valor)}</span>` : faixas.length ? '<span class="st st-good">Bônus máximo</span>' : ''}</div>`;
  // cenários: hoje, a simulação, a meta e cada faixa de bônus ainda não alcançada
  const porVenda = c.extra ? c.comSim / c.extra : c.fixo;
  const cen = [{ t: 'Só o que já está lançado', n: 0 }];
  if (c.extra) cen.push({ t: 'A sua simulação', n: c.extra });
  if (meta && c.feitas < meta) cen.push({ t: 'Batendo a meta', n: Math.ceil(meta) - c.feitas });
  faixas.forEach(f => { if (c.feitas < f.vendas) cen.push({ t: `Bônus de ${brl(f.valor)}`, n: f.vendas - c.feitas }); });
  const vistos = new Set(), linhas = cen.filter(x => !vistos.has(x.n) && vistos.add(x.n)).sort((a, b) => a.n - b.n).map(x => {
    const tot = c.feitas + x.n, fx = faixas.filter(f => tot >= f.vendas).pop(), b = fx ? fx.valor : 0;
    const fim = S.sim.salario + c.comFeita + x.n * porVenda + b;
    return `<tr${x.n === c.extra ? ' style="background:var(--brand-soft)"' : ''}><td>${esc(x.t)}</td><td class="n">+${int(x.n)}</td><td class="n">${int(tot)}</td><td class="n">${brl(b)}</td><td class="n"><b>${brl(fim)}</b></td></tr>`;
  }).join('');
  $('#sCen').innerHTML = `<div class="tab"><table><thead><tr><th>Cenário</th><th class="n">Vendas a mais</th><th class="n">Vendas no mês</th><th class="n">Bônus</th><th class="n">Total do mês</th></tr></thead>
    <tbody>${linhas}</tbody></table></div>
    <div class="t-s">Cada venda a mais conta ${brl(porVenda)} de comissão${c.extra ? ' (média da sua simulação)' : ' (valor fixo por venda)'}. Valores são uma estimativa; o que vale é o que o gestor lançar.</div>`;
}
function simMudou() {
  const sim = S.sim;
  sim.salario = numero($('#sSal').value);
  sim.extra = numero($('#sExtra').value);
  ADIC.forEach((a, i) => { sim.adic[a] = { qtd: numero($('#sQ' + i).value), valor: numero($('#sV' + i).value) }; });
  simSalvar(); simResultado();
}
function simExtra(d, fixo) { const el = $('#sExtra'); el.value = fixo != null ? fixo : Math.max(0, numero(el.value) + d); simMudou(); }

function kbResultado() {

    tipo: pick(['C2C', 'Turbo', 'Trade-in']), adicionais: ['Despachante', 'Seguro Gestauto', 'Financiamento'].filter(() => r() < 0.3) }); });
  Object.values(vendas).flat().forEach(v => { v.valores = Object.fromEntries(v.adicionais.map(a => [a, pick([100, 150, 200, 300])])); v.comissao = 300 + soma(Object.values(v.valores), x => x); });
  return {
